<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Gamepad Icon -->
  <g transform="translate(5, 8)" filter="url(#glow)">
    <rect x="8" y="5" width="34" height="28" rx="8" fill="none" stroke="url(#neonGrad)" stroke-width="2.5"/>
    <rect x="2" y="12" width="12" height="14" rx="5" fill="none" stroke="url(#neonGrad)" stroke-width="2"/>
    <rect x="36" y="12" width="12" height="14" rx="5" fill="none" stroke="url(#neonGrad)" stroke-width="2"/>
    <circle cx="18" cy="18" r="2" fill="#00ff88"/>
    <circle cx="14" cy="18" r="2" fill="#00d4ff"/>
    <circle cx="16" cy="14" r="2" fill="#a855f7"/>
    <circle cx="16" cy="22" r="2" fill="#ffd700"/>
    <line x1="32" y1="16" x2="38" y2="16" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
    <line x1="35" y1="13" x2="35" y2="19" stroke="#00ff88" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text ASGARD -->
  <text x="60" y="28" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="24" font-weight="700" fill="url(#neonGrad)" filter="url(#glow)">ASGARD</text>
  <!-- Text STORE -->
  <text x="60" y="50" font-family="'Orbitron', 'Rajdhani', sans-serif" font-size="18" font-weight="400" fill="#ffffff" opacity="0.8" letter-spacing="8">STORE</text>
</svg>