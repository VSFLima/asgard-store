# Asgard Store - Configuracao Nginx
# Incluir no server block do nginx

server {
    listen 80;
    server_name asgard.store www.asgard.store;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name asgard.store www.asgard.store;

    root /var/www/asgard-store;
    index index.php;

    # SSL
    ssl_certificate /etc/letsencrypt/live/asgard.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asgard.store/privkey.pem;

    # Seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proteger arquivos sensiveis
    location ~* /(config|db)\.php$ {
        deny all;
        return 404;
    }

    # PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloquear diretorios
    location ~ /\. {
        deny all;
    }
    location ~ ^/(assets/img/(games|icons|moedas|uploads)/)$ {
        autoindex off;
    }
}
